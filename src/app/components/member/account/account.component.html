

<div class="grid grid-cols-12 gap-8">
    <div class="col-span-12 lg:col-span-6 xl:col-span-4">
    <div class="card mb-0">
<div class="flex justify-between mb-4">
    <div>
        <p-button (onClick)="goToTransfert()">Transfert</p-button>
        <!-- <span class="block text-500 font-medium mb-4">Bienvenue </span>
        <span class="text-surface-900 dark:text-surface-0 font-medium text-xl">Total Balance FCFA</span> -->

        <div>
            <!-- <span class="block text-500 font-medium mb-3" *ngIf="selectedAccount.accountType === 1">Compte Poche</span>
            <span class="block text-500 font-medium mb-3" *ngIf="selectedAccount.accountType === 2">Compte Épargne</span> -->
            <!-- <div class="text-900 font-medium text-xl">{{ selectedAccount.balance }} FCFA</div> -->
        </div>
    </div>
    <div class="flex justify-center">
        <p-select [options]="accounts()" [(ngModel)]="selectedAccount" optionLabel="accountType" 
        placeholder="Select an Account" class="w-full md:w-56" (onChange)="onChange($event)" />
    </div>
    <div class="flex items-center justify-center bg-cyan-100 dark:bg-cyan-400/10 rounded-border"
        style="width: 2.5rem; height: 2.5rem">
        <i class="pi pi-users text-cyan-500 !text-xl"></i>
    </div>
</div>
</div>
</div>



<div class="col-span-12 xl:col-span-12">
    <div class="card mb-0">
<p-table [value]="operations" stripedRows styleClass="p-datatable-striped" [paginator]="true" [rows]="10" responsiveLayout="scroll">
    <ng-template pTemplate="header">
        <tr>
            <th pSortableColumn="operationDate">Date<p-sortIcon field="operationDate"></p-sortIcon></th>
            <th>Motif</th>
            <th pSortableColumn="amount">Mouvements<p-sortIcon field="amount"></p-sortIcon></th>
            <th>Etat</th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-operation>
        <tr>
            <td>{{ operation.operationDate | date:'dd-MM-yyyy'}} </td>
            <td>{{ operation.itendedUse }} </td>
            <td>
                <span class="text-green-500" *ngIf="operation.operationType === 1">
                    + {{ operation.amount }} FCFA
                </span>
                <span class="text-red-500"
                    *ngIf="(operation.operationType === 2 || operation.operationType === 3)">
                    - {{ operation.amount }} FCFA
                </span>
                <span class="text-blue-500" *ngIf="operation.operationType === 5">
                    + 0 FCFA
                </span>
            </td>
            <td>{{ operation.balanceAfterBooking }} </td>
        </tr>
    </ng-template>
</p-table>
</div>
</div>
</div>
